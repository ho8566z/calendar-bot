<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="~{include/title::title}"/>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">

</head>
<body>

<header th:replace="~{include/header_nav_footer::header}" />

<nav th:replace="~{include/header_nav_footer::nav}"/>

<section>
    <div id="section_wrap">
        <div class="word">
            SIGN-IN RESULT
        </div>
        <div class="content">
            <th:block th:if="${loginedID != null}">
                SIGN-IN SUCCESS
            </th:block>
            <th:block th:if="${loginedID == null}">
                SIGN-IN FAIL
            </th:block>
            <p id="login_locked" th:if="${locked}"
               th:text="|로그인 시도가 너무 많습니다. ${lockMinutes}분 후 다시 시도해 주세요|"></p>
        </div>
    </div>
</section>

<footer th:replace="~{include/header_nav_footer::footer}"/>

</body>
</html>
