<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header th:fragment="header">
    <div id="top">
        <h3>MY CALENDAR</h3>
        <!-- 좁은 화면(모바일)에서만 보이는 메뉴 버튼 -->
        <button type="button" id="menu_toggle" aria-controls="header_wrap nav_wrap" aria-expanded="false">MENU</button>
    </div>
    <div id="header_wrap">
        <a th:href="@{/}">home</a>

        <!--
        <span th:if="${session.loginedID == null}">
                <a th:href="@{/member/signup}">sign-up</a> &nbsp;&nbsp;
                <a th:href="@{/member/signin}">sign-in</a> &nbsp;&nbsp;
        </span>

        <span th:if="${session.loginedID != null}">
                 <a th:href="@{/member/modify}">modify</a> &nbsp;&nbsp;
                <a th:href="@{/member/signout_confirm}">signout</a> &nbsp;&nbsp;
        </span>
        -->

        <th:block sec:authorize="!hasAnyRole('PRE_USER', 'USER', 'ADMIN')">
            <a th:href="@{/member/signup}">sign-up</a>
            <a th:href="@{/member/signin}">sign-in</a>
        </th:block>

        <th:block sec:authorize="hasAnyRole('PRE_USER', 'USER', 'ADMIN')">
            <a th:href="@{/member/modify}">modify</a>
            <a th:href="@{/member/signout_confirm}">signout</a>
        </th:block>

    </div>
    <script th:src="@{/js/menu.js}" defer></script>
</header>

<nav th:fragment="nav">
    <div id="nav_wrap">
        <a th:href="@{/planner}" sec:authorize="!hasRole('ADMIN')">planner</a>
        <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')">admin</a>
    </div>
</nav>

<footer th:fragment="footer">
    <div id="footer_wrap">
        Copyright OFFICE Corp. ALL Rights Reserved.
    </div>
</footer>

</html>
