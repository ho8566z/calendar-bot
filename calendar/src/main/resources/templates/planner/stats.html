<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:replace="~{include/title::title}"/>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/planner_stats.css}">

    <script th:src="@{/js/planner_stats.js}" defer></script>

</head>
<body>

<header th:replace="~{include/header_nav_footer::header}" />

<nav th:replace="~{include/header_nav_footer::nav}"/>

<section>
    <div id="section_wrap">
        <div class="word">
            MONTHLY STATS
        </div>

        <div class="content">

            <!-- 년, 월 선택 -->
            <div class="select_wrap">
                <button type="button" id="btn_pre">&#60;</button>
                <select name="s_year">
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                </select>년
                <select name="s_month">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>월
                <button type="button" id="btn_next">&#62;</button>
            </div>

            <!-- 처리 결과·오류 안내 -->
            <p id="message" class="message" role="status"></p>

            <!-- 요약 -->
            <div id="summary" class="summary">
                <div class="total">이 달의 일정 <b id="total_count">0</b>건</div>
                <div class="busiest" id="busiest_text"></div>
            </div>

            <!-- 요일별 -->
            <h3>요일별 일정 수</h3>
            <table id="weekday_table">
                <thead>
                <tr><th>요일</th><th>일정 수</th><th>비율</th></tr>
                </thead>
                <tbody id="weekday_rows"></tbody>
            </table>

            <!-- 주별 -->
            <h3>주별 일정 수</h3>
            <table id="week_table">
                <thead>
                <tr><th>주</th><th>날짜</th><th>일정 수</th><th>비율</th></tr>
                </thead>
                <tbody id="week_rows"></tbody>
            </table>

            <p class="hint">
                <a th:href="@{/planner}">달력으로 돌아가기</a><br>
                통계는 내 일정만 집계하며 주는 달력의 줄(일요일 시작)과 같습니다.
            </p>

        </div>
    </div>
</section>

<footer th:replace="~{include/header_nav_footer::footer}"/>

</body>
</html>
