spring.application.name=calendar

# Tomcat
server.port=8090

# Dev Tools
spring.devtools.restart.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

# MySQL (접속 정보는 환경변수로 받는다)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/DB_CALENDAR}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# log4j2
logging.config=classpath:logger/log4j2.xml

# Mybatis
mybatis.config-location=classpath:mybatis/config/mybatis-config.xml
mybatis.mapper-locations=classpath:mybatis/mappers/*.xml

# JPA for MySQL

# MySQL 버전에 맞는 Dialect를 사용하도록 설정합니다.
# Dialect는 데이터베이스와 통신할 때 사용할 SQL 문법과 기능을 정의하는 역할을 하는 것으로
# 지금은 MySQL SQL 문법을 사용하도록 정의합니다.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 테이블 자동 생성 설정으로 만약 테이블이 없다면 새로 생성하고,
# 기존 테이블이 있다면 테이블 구조가 엔티티 클래스에 맞게 변경됩니다.
# 즉, 테이블이 이미 존재하면 생성하지 않고, 필요 부분만 변경합니다.
# 지금은 주석 처리해서 지금까지 사용한 테이블을 그대로 사용하기로 합니다.
spring.jpa.hibernate.ddl-auto=update

# 테이블·컬럼 이름을 엔티티에 적은 그대로(USER_MEMBER 등) 만든다.
# 기본 규칙은 소문자(user_member)로 바꾸는데, 리눅스 MySQL은 테이블 이름의 대소문자를 구분해서
# 대문자로 쓴 MyBatis SQL(USER_MEMBER, USER_AUTHORITY)이 테이블을 못 찾는다.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 실행되는 SQL문을 콘솔에 출력하도록 설정합니다.
spring.jpa.show-sql=true

# SQL문을 보기 좋게 출력하도록 설정합니다.
spring.jpa.properties.hibernate.format_sql=true

# Admin seed (환경변수로 받는다. 비어 있으면 관리자 계정을 만들지 않는다)
app.admin.id=${ADMIN_ID:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.mail=${ADMIN_MAIL:}

# Telegram 브리핑 (토큰·봇 이름은 환경변수로 받는다. 비어 있으면 연동·발송을 쓸 수 없고 앱은 그대로 뜬다)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.link-minutes=10
telegram.api-base=https://api.telegram.org
# 폴링은 서버 한 곳에서만 켠다(같은 봇을 두 곳에서 폴링하면 409). 다른 서버에서 띄울 때는 false 로 끈다
telegram.polling.enabled=true

# 정해진 작업(텔레그램 롱 폴링, 주간 브리핑 발송)이 서로 밀리지 않게 스레드를 2개 둔다
spring.task.scheduling.pool.size=2

# Spring active
spring.profiles.active=local