# 로컬 개발 설정 샘플
# 이 파일은 설명용이다. 실제 값은 환경변수로 넣고, 따로 설정 파일이 필요하면
# application-local.properties 로 복사해 쓴다(그 파일은 .gitignore 로 커밋되지 않는다).
#
# 필수 환경변수
#   DB_USERNAME / DB_PASSWORD     MySQL 계정
#   MAIL_USERNAME / MAIL_PASSWORD Gmail 계정과 앱 비밀번호(비밀번호 찾기 메일)
# 선택 환경변수
#   DB_URL  기본값 jdbc:mysql://localhost:3306/DB_CALENDAR (dev·prod 프로파일은 각자의 기본값)
#   ADMIN_ID / ADMIN_PASSWORD / ADMIN_MAIL  첫 관리자 계정(ADMIN_ID·ADMIN_PASSWORD가 없으면 만들지 않는다)
#
# 비밀번호·토큰 값은 이 파일, 문서, 커밋, 채팅에 적지 않는다.
#
# 예) PowerShell 에서 현재 창에만 적용
#   $env:DB_USERNAME = "<계정>"
#   $env:DB_PASSWORD = "<비밀번호>"
#   $env:MAIL_USERNAME = "<Gmail 주소>"
#   $env:MAIL_PASSWORD = "<Gmail 앱 비밀번호>"

# 기본 설정(application.properties)만으로 부족할 때 여기에서 덮어쓴다.
#spring.datasource.url=jdbc:mysql://localhost:3306/DB_CALENDAR
